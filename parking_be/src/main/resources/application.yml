spring:
  application:
    name: smart-parking-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dparking?currentSchema=smart_parking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SmartParkingHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:smart_parking}
        jdbc.time_zone: UTC
        format_sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:smart_parking}
    default-schema: ${DB_SCHEMA:smart_parking}
    create-schemas: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never
  jackson:
    time-zone: UTC
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

smart-parking:
  jwt:
    issuer: ${JWT_ISSUER:smart-parking}
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-characters}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  booking:
    hold-timeout-minutes: ${BOOKING_HOLD_TIMEOUT_MINUTES:15}
    approval-timeout-minutes: ${BOOKING_APPROVAL_TIMEOUT_MINUTES:60}
    active-overlap-statuses:
      - PENDING_APPROVAL
      - PENDING_PAYMENT
      - CONFIRMED
      - CHECKED_IN
      - OVERDUE
  pricing:
    currency: ${PRICING_CURRENCY:VND}
    platform-fee-rate: ${PLATFORM_FEE_RATE:0.00}
    tax-rate: ${TAX_RATE:0.00}
    default-hourly-rate: ${DEFAULT_HOURLY_RATE:0.00}
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:change-this-payment-webhook-secret}
  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:5}
    length: ${OTP_LENGTH:6}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:smart-parking}
  upload:
    max-avatar-bytes: ${MAX_AVATAR_BYTES:5242880}
    allowed-avatar-content-types:
      - image/jpeg
      - image/png
      - image/webp
